name: M3 workspace verification
on:
  pull_request:
    paths:
      - 'app/**'
      - 'static/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - '.github/workflows/m3-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked CPU environment
        run: uv sync --frozen --extra cpu
      - name: Original, M1, M2 and M3 regressions
        run: uv run --no-sync pytest -q --junitxml=m3-fast.xml
      - name: Frontend state, precision, models and stale-project checks
        run: node --test tests/frontend/workspace.test.mjs
      - name: Genuine tiger inference, project checkpoint and STL/OBJ roundtrips
        env:
          P2R_DEVICE: cpu
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: uv run --no-sync pytest -q -m slow tests/test_m3_smoke.py --junitxml=m3-real.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-${{ matrix.os }}
          path: |
            m3-fast.xml
            m3-real.xml
          if-no-files-found: warn
