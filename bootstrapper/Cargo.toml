[package]
name = "relief-bootstrap"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
directories = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
fs2 = "0.4"
getrandom = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
